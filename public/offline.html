<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <title>Hors connexion | English Center</title>
    <style>
      :root{color-scheme:light;font-family:Arial,sans-serif;color:#172033;background:#f5f7fb}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(1.25rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(1.25rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left))}
      main{width:min(100%,34rem);padding:clamp(1.5rem,6vw,3rem);border:1px solid #dfe4ec;border-radius:1.25rem;background:#fff;box-shadow:0 18px 50px #173b571a;text-align:center}
      .mark{display:grid;place-items:center;width:5rem;height:5rem;margin:0 auto 1.5rem;border-radius:1.25rem;background:#1d4ed8;color:#fff;font-size:1.75rem;font-weight:800}
      h1{margin:.25rem 0;font-size:clamp(1.75rem,7vw,2.5rem)}p{color:#667085}.actions{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
      a,button{border:0;border-radius:.65rem;padding:.8rem 1rem;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button{background:#1d4ed8;color:#fff}a{border:1px solid #dfe4ec;color:#173b57;background:#fff}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">EC</div>
      <h1>Vous êtes hors connexion.</h1>
      <p>Certaines fonctionnalités d’English Center nécessitent une connexion Internet.</p>
      <p>Vérifiez votre connexion puis réessayez.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Réessayer</button>
        <a href="/">Revenir à l’accueil</a>
      </div>
    </main>
  </body>
</html>
