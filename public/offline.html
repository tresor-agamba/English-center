<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17105c">
    <title>Hors connexion | New Vision Academy</title>
    <style>
      :root{color-scheme:light;font-family:Arial,sans-serif;color:#191a33;background:#f7f9fc}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(1.25rem + env(safe-area-inset-top)) calc(1.25rem + env(safe-area-inset-right)) calc(1.25rem + env(safe-area-inset-bottom)) calc(1.25rem + env(safe-area-inset-left))}
      main{width:min(100%,34rem);padding:clamp(1.5rem,6vw,3rem);border:1px solid #dde2eb;border-radius:1.25rem;background:#fff;box-shadow:0 18px 50px #17105c1a;text-align:center}
      .mark{display:block;width:7rem;height:7rem;object-fit:contain;margin:0 auto 1.5rem;border-radius:1.25rem;background:#fff}
      h1{margin:.25rem 0;font-size:clamp(1.75rem,7vw,2.5rem)}p{color:#5f6475}.actions{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
      a,button{border:0;border-radius:.65rem;padding:.8rem 1rem;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button{background:#17105c;color:#fff}a{border:1px solid #dde2eb;color:#17105c;background:#fff}
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="New Vision Academy">
      <h1>Vous êtes hors connexion.</h1>
      <p>Certaines fonctionnalités de New Vision Academy nécessitent une connexion Internet.</p>
      <p>Vérifiez votre connexion puis réessayez.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Réessayer</button>
        <a href="/">Revenir à l’accueil</a>
      </div>
    </main>
  </body>
</html>
