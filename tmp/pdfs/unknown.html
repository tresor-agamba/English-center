<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vérifier un certificat | English Center</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">English Center</a>
      <nav aria-label="Navigation principale">
        <a href="/">Accueil</a>
        <a href="/formations">Formations</a>
        <a class="button button-small" href="/login">Connexion</a>
      </nav>
    </header>
    <main class="container">

<main class="certificate-verify">
  <section class="certificate-verify-hero">
    <p class="eyebrow">Service public</p>
    <h1>Vérifier un certificat</h1>
    <p>Saisissez le numéro du certificat ou son code de vérification exact.</p>
    <form method="post" action="/certificates/verify" class="certificate-search">
      <label for="query">Numéro ou code de vérification</label>
      <div>
        <input id="query" name="query" minlength="8" maxlength="100" autocomplete="off" required>
        <button class="button" type="submit">Vérifier</button>
      </div>
    </form>
  </section>

  
    <section class="certificate-result certificate-result-unknown" role="status">
      <h2>Résultat de la vérification</h2>
      <p>Aucun certificat valide ne correspond à ces informations.</p>
    </section>
  

  
</main>
    </main>
    <footer class="site-footer">
      <p>&copy; 2026 English Center</p>
    </footer>
    <script src="/js/main.js"></script>
  </body>
</html>
